name: Stage exact retrowave PNG assets

on:
  push:
    branches:
      - render-console-retrowave-png-fix
    paths:
      - .github/workflows/stage-retrowave-pngs.yml

permissions:
  contents: write

jobs:
  stage-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact Adobe-staged PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/scenes/first-retrowave/frames
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/L9MP4r0sw6NgXTWP' -o assets/scenes/first-retrowave/base-scene.png
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/ejjA9y2VouGwJn84' -o assets/scenes/first-retrowave/frames/frame-01.png
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/ra3A20qazGfhdQ1v' -o assets/scenes/first-retrowave/frames/frame-02.png
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/XBeQs6F6jIOmAGg4' -o assets/scenes/first-retrowave/frames/frame-03.png
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/kwO7qfndBTUCwvqa' -o assets/scenes/first-retrowave/frames/frame-04.png

      - name: Verify archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' | sha256sum -c -
          9c7f6091972de79070fec6491223f880afc28094d867f8d6628661edfcaf301f  assets/scenes/first-retrowave/base-scene.png
          19055c3ab5cdd786a650892666562b2e0a23dd9033a5f717c1c430a36f8f4485  assets/scenes/first-retrowave/frames/frame-01.png
          a4ba1055231b9a28d953db13b1a5727af98398c062eddcf6a68e1bf14bb0379a  assets/scenes/first-retrowave/frames/frame-02.png
          e28b1fbf7c7f1c739b95938bf14c9d33f64b8165969b2280df417c9a113e941d  assets/scenes/first-retrowave/frames/frame-03.png
          40b22389b65c100488526ade26712f73e7e9218a2cd81d55beb225235846a231  assets/scenes/first-retrowave/frames/frame-04.png
          EOF

      - name: Commit staged PNGs and remove one-time transfer workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'doretradinguk-cyber'
          git config user.email 'doretradinguk@gmail.com'
          git add assets/scenes/first-retrowave/base-scene.png assets/scenes/first-retrowave/frames/frame-01.png assets/scenes/first-retrowave/frames/frame-02.png assets/scenes/first-retrowave/frames/frame-03.png assets/scenes/first-retrowave/frames/frame-04.png
          git rm --force .github/workflows/stage-retrowave-pngs.yml
          git commit -m 'Add exact retrowave PNG background assets'
          git push origin HEAD:render-console-retrowave-png-fix
